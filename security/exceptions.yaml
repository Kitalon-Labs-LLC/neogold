# NeoGold Security Exceptions Ledger (P26, docs/8_Security_Compliance_Plan.md Section 10)
#
# Rules enforced by tools/secscan/evaluate_secscan.py:
# 1. Every entry MUST declare: id, tool, rule, severity, file, reason, approver, created_at, expires_at.
# 2. expires_at MUST NOT be in the past and MUST NOT be more than 90 days after created_at or the scan date.
# 3. The security scan fails on any HIGH or CRITICAL finding not matched by a valid, non-expired exception here.
# 4. Inline security suppressions in source code (# nosec, # noqa: S*, gitleaks:allow, security @Suppress/@SuppressLint)
#    are allowed ONLY when the same line cites a valid exception ID (SEC-EXC-XXXX) from this file.
# 5. Changes to this file require owner review (.github/CODEOWNERS).

