[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neogold-backend"
version = "1.0.0"
description = "NeoGold Study Intake Backend"
authors = [{ name = "Kitalon Labs" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "cryptography>=43.0.3",
    "pillow>=10.4.0",
]

[project.scripts]
neogold-admin = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
