[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neogold-train"
version = "1.0.0"
description = "Deterministic reproducible training pipeline for NeoGold on-device bilirubin estimation model"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kitalon Labs", email = "research@kitalonlabs.com" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
