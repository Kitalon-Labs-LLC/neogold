<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Medical Teal -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083E47" />
      <stop offset="50%" stop-color="#0B5C68" />
      <stop offset="100%" stop-color="#042329" />
    </linearGradient>

    <!-- Golden Droplet Gradient: Warm Radiant Amber to Deep Gold -->
    <linearGradient id="goldDrop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Reticle Gradient: Clean Clinical Cyan -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#01161A" flood-opacity="0.5" />
    </filter>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#021C22" flood-opacity="0.4" />
    </filter>
    
    <radialGradient id="centerAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B5C68" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background Rounded Squircle Tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tileBg)" filter="url(#tileShadow)" />

  <!-- 2. Ambient Warmth Aura -->
  <circle cx="256" cy="270" r="160" fill="url(#centerAura)" />

  <!-- 3. Optical Calibration Viewfinder Reticle (Camera Focus + Card Frame) -->
  <g stroke="url(#reticleGrad)" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Top-Left -->
    <path d="M 104 156 L 104 124 A 20 20 0 0 1 124 104 L 156 104" />
    <!-- Top-Right -->
    <path d="M 356 104 L 388 104 A 20 20 0 0 1 408 124 L 408 156" />
    <!-- Bottom-Left -->
    <path d="M 104 356 L 104 388 A 20 20 0 0 0 124 408 L 156 408" />
    <!-- Bottom-Right -->
    <path d="M 356 408 L 388 408 A 20 20 0 0 0 408 388 L 408 356" />
  </g>

  <!-- Optical Calibration Alignment Nodes -->
  <circle cx="256" cy="104" r="4.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="256" cy="408" r="4.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="104" cy="256" r="4.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="408" cy="256" r="4.5" fill="#38BDF8" opacity="0.8" />

  <!-- 4. Central Emblem: The Golden Bilirubin & Life Droplet -->
  <g filter="url(#dropGlow)">
    <!-- Perfectly proportioned teardrop / golden shield -->
    <path d="M 256 135 
             C 315 210, 348 262, 348 305 
             C 348 356, 307 395, 256 395 
             C 205 395, 164 356, 164 305 
             C 164 262, 197 210, 256 135 Z" 
          fill="url(#goldDrop)" />

    <!-- Protective Swaddle Cradle (Crisp Ivory-White crescent wrapping the infant) -->
    <path d="M 200 295 
             C 200 350, 235 376, 275 376 
             C 312 376, 335 348, 335 315 
             C 335 292, 322 270, 310 258 
             C 316 278, 312 305, 296 322 
             C 278 342, 245 346, 222 330 
             C 208 320, 201 306, 200 295 Z" 
          fill="#FFFFFF" opacity="0.95" />

    <!-- Sleeping Infant Profile (Pure White silhouette integrated in the droplet) -->
    <!-- Head -->
    <circle cx="256" cy="250" r="30" fill="#FFFFFF" />

    <!-- Sleek sleeping closed eye -->
    <path d="M 260 250 C 264 256, 272 256, 276 250" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" />

    <!-- Peaceful smile -->
    <path d="M 267 260 C 270 263, 274 262, 276 260" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" />

    <!-- Infant upper swaddle curve -->
    <path d="M 235 268 C 242 268, 268 272, 276 288 C 282 300, 274 316, 258 318 C 242 320, 228 308, 228 292 C 228 278, 234 268, 235 268 Z" 
          fill="#FFFFFF" />

    <!-- Light Gleam on Droplet -->
    <path d="M 235 185 C 222 208, 210 240, 210 265 C 206 260, 204 250, 207 236 C 213 214, 228 193, 235 185 Z" 
          fill="#FEF08A" opacity="0.8" />
  </g>

  <!-- Precision Optical Sparkle / Crosshair Glint -->
  <path d="M 335 160 Q 343 170 353 170 Q 343 170 335 180 Q 335 170 325 170 Q 335 170 335 160 Z" fill="#FEF08A" />
</svg>