name: backend-ci
on:
  pull_request:
    paths: ["backend/**", "docs/api/openapi.yaml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    tags: ["intake-v*.*.*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock
      - name: Lint and static analysis
        working-directory: backend
        run: |
          ruff check .
          bandit -q -r app
      - name: Tests (including doc 7 Section 12.3 authentication cases)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          IMAGE_STORE_DIR: ${{ runner.temp }}/images
          NEOGOLD_SKIP_BACKUP_CHECK: "1"
        run: pytest -q
      - name: Spec lint and server-spec diff
        run: |
          python3 -m openapi_spec_validator docs/api/openapi.yaml
          python3 backend/tools/diff_spec.py docs/api/openapi.yaml
      - name: Runtime lock consistency
        run: python3 backend/tools/check_runtime_lock.py backend/requirements-runtime.lock backend/requirements.lock
      - name: ShellCheck deploy scripts
        run: shellcheck -x backend/deploy/neogold-deploy backend/deploy/smoke.sh backend/deploy/neogold-backup backend/deploy/neogold-bootstrap backend/deploy/neogold-admin backend/tools/validate_deploy.sh
  schema-compat:
    # Expand-only check (doc 12 Section 2): the PREVIOUS release's tests must pass against the NEW schema.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Migrate to the new head
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          alembic upgrade head
      - name: Run the previous release's tests against it
        env:
          IMAGE_STORE_DIR: ${{ runner.temp }}/images
          NEOGOLD_SKIP_BACKUP_CHECK: "1"
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'intake-v*' HEAD^ 2>/dev/null || true)"
          if [ -z "$prev" ]; then echo "no previous release yet"; exit 0; fi
          git worktree add "$RUNNER_TEMP/prev" "$prev"
          cd "$RUNNER_TEMP/prev/backend"
          pip install --require-hashes -r requirements.lock
          pytest -q --no-migrate    # previous code, current schema
  image:
    if: github.event_name == 'push'
    needs: [test, schema-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase image repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/neogold-intake" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          build-contexts: repo-config=config
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Record the digest for deployment
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Deploy with: neogold-deploy ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
  scan:
    # Separate job, no secrets, read-only token (doc 8 T12).
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Lowercase image repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/neogold-intake" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, verify before adopting
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
