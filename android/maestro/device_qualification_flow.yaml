appId: ${APP_ID}
---
# ==============================================================================
# NeoGold Device Check, Card Scan & Camera Qualification (TC-DEV-01 to TC-DEV-10, TC-CARD-01)
# Target devices: D1 (Transsion), D2 (Xiaomi), D4 (Android Go 2GB)
#
# Run against the debug build, which exposes screen test tags as ids:
#   maestro test -e APP_ID=com.kitalonlabs.neogold.debug android/maestro/device_qualification_flow.yaml
# Needs a real printed NeoGold calibration card with its QR (a signed batch the test trust list or the release
# trust list accepts), laid flat in room light. Nothing here is simulated: the QR is read and the photos are taken
# by the phone's own camera, and the verdict is whatever the phone measures.
# ==============================================================================

- launchApp:
    clearState: true
    permissions:
      camera: allow

# Language and the safety notice (S01 to S04)
- tapOn:
    id: "lang_option_en"
- tapOn:
    id: "btn_language_continue"
- extendedWaitUntil:
    visible:
      id: "safety_notice_card"
    timeout: 8000
- tapOn:
    id: "btn_safety_next"
- tapOn:
    id: "btn_safety_next"
- tapOn:
    id: "btn_acknowledge_safety"

# 1. Device check (S05): TC-DEV-01, TC-DEV-09, TC-DEV-10
- extendedWaitUntil:
    visible:
      id: "btn_device_check_continue"
    timeout: 8000
- assertVisible:
    text: "Memory: .* MB"
- assertVisible:
    text: "Camera level: .*"
- assertVisible:
    id: "btn_view_supported_devices"
- tapOn:
    id: "btn_device_check_continue"

# 2. Card scan (S06): TC-CARD-01. Continue stays off until the signed card has been read and checked.
- extendedWaitUntil:
    visible:
      id: "card_scan_viewfinder"
    timeout: 8000
- assertVisible:
    id: "scan_looking"
- extendedWaitUntil:
    visible:
      id: "badge_card_verified"
    timeout: 30000
- tapOn:
    id: "btn_card_scan_continue"

# 3. Camera qualification (S07): TC-DEV-02 to TC-DEV-06. A photo the quality gate refuses is asked for again.
- extendedWaitUntil:
    visible:
      id: "qualification_viewfinder"
    timeout: 8000
- assertVisible:
    text: "Take 3 photos.*Photo 1 of 3.*"
- tapOn:
    id: "btn_take_qualification_photo"
- extendedWaitUntil:
    notVisible:
      id: "qualification_checking"
    timeout: 30000
- assertVisible:
    text: "Take 3 photos.*Photo 2 of 3.*"
- tapOn:
    id: "btn_take_qualification_photo"
- extendedWaitUntil:
    notVisible:
      id: "qualification_checking"
    timeout: 30000
- assertVisible:
    text: "Take 3 photos.*Photo 3 of 3.*"
- tapOn:
    id: "btn_take_qualification_photo"

# 4. The measured result (S08): TC-DEV-05, TC-DEV-06, TC-DEV-08. Either verdict is a pass for this flow.
- extendedWaitUntil:
    visible:
      id: "qualification_result_card"
    timeout: 60000
- assertVisible:
    id: "btn_get_started"
- tapOn:
    id: "btn_get_started"
- extendedWaitUntil:
    visible:
      id: "home_experimental_banner"
    timeout: 8000
