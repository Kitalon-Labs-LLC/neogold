appId: com.kitalonlabs.neogold
---
# ==============================================================================
# NeoGold Device Check & Camera Qualification Flow (TC-DEV-01 to TC-DEV-10)
# Target devices: D1 (Transsion), D2 (Xiaomi), D4 (Android Go 2GB)
# ==============================================================================

- launchApp:
    clearState: true

# 1. Device Check Screen (S05) - TC-DEV-01, TC-DEV-09, TC-DEV-10
- assertVisible:
    id: "device_check_screen"

- assertVisible:
    id: "text_device_model"

- assertVisible:
    id: "text_device_ram"

- assertVisible:
    id: "text_camera_level"

# Brand-specific battery optimization guidance (TC-DEV-09)
- assertVisible:
    id: "battery_guidance_card"

# Tap battery settings button (deep link or fallback to battery optimization settings)
- tapOn:
    id: "btn_open_battery_settings"

- back

# 2. Advance to Camera Qualification (S07) - TC-DEV-02, TC-DEV-03, TC-DEV-04
- tapOn:
    id: "btn_start_qualification"

- assertVisible:
    id: "qualification_camera_screen"

# Photo 1 capture
- assertVisible:
    text: ".*Photo 1 of 3.*"
- extendedWaitUntil:
    visible:
      id: "steady_progress_bar"
    timeout: 8000
- tapOn:
    id: "btn_capture_qualification_photo"
    optional: true

# Photo 2 capture
- extendedWaitUntil:
    visible:
      text: ".*Photo 2 of 3.*"
    timeout: 8000
- tapOn:
    id: "btn_capture_qualification_photo"
    optional: true

# Photo 3 capture
- extendedWaitUntil:
    visible:
      text: ".*Photo 3 of 3.*"
    timeout: 8000
- tapOn:
    id: "btn_capture_qualification_photo"
    optional: true

# 3. Qualification Evaluation & Result (S08) - TC-DEV-05, TC-DEV-06, TC-DEV-08
- extendedWaitUntil:
    visible:
      id: "qualification_result_screen"
    timeout: 10000

# Verify Qualified status or Research-only status
- assertVisible:
    id: "text_qualification_status"

- assertVisible:
    id: "text_repeatability_metric"

- assertVisible:
    id: "text_uniformity_metric"

- assertVisible:
    id: "text_accuracy_metric"

- tapOn:
    id: "btn_continue_from_qualification"
