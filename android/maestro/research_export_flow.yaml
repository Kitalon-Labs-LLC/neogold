appId: com.kitalonlabs.neogold
---
# ==============================================================================
# NeoGold Research Mode: Encrypted USB / File Export Flow (doc 8 Section 3, doc 10 TC-EXP-01, TC-EXP-04)
# Target devices: D1 (Transsion), D2 (Xiaomi), D3 (Samsung), D4 (Android Go 2GB), D5, D6
# ==============================================================================

- launchApp:
    clearState: false

# 1. Screen R02: Study Home Screen
- extendedWaitUntil:
    visible:
      id: "export_data_button"
    timeout: 8000

- tapOn:
    id: "export_data_button"

# 2. Screen R07: Research Export Screen
- extendedWaitUntil:
    visible:
      id: "export_study_info_card"
    timeout: 8000

# Select Destination & Trigger Encrypted Export (TC-EXP-01)
- assertVisible:
    id: "export_select_location_button"
- tapOn:
    id: "export_select_location_button"

# 3. Packaging & Encryption Progress (AES-256-GCM via Tink)
- extendedWaitUntil:
    visible:
      id: "export_progress_card"
    timeout: 5000
    optional: true

# 4. Verify Export Complete Card
- extendedWaitUntil:
    visible:
      id: "export_completed_card"
    timeout: 25000

# 5. Tap Done and Return
- assertVisible:
    id: "export_done_button"
- tapOn:
    id: "export_done_button"

- extendedWaitUntil:
    visible:
      id: "new_session_button"
    timeout: 5000
