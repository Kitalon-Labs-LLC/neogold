# Extra rules for every :engine:* module (the four pure engines, :engine:vision and :engine:camera).
# Doc 4 Section 4.2: the pure engines use java.lang.StrictMath so arm64-v8a and armeabi-v7a give bit-identical results.
# The last four entries keep :engine:vision to the OpenCV modules it needs (ADR-018, supply-chain review of 29 October).
#
# This file bans importing the platform versions. A call such as Math.pow(x, 2.0) needs no import, so
# tools/check_strictmath.py is the check that catches those. detekt's ForbiddenMethodCall would too, but it needs
# type resolution (detektMain) and the plain detekt task that CI runs skips it, so it is not configured here
# (BUG-2026-047). The trigonometric and cube-root entries go beyond the powers, roots and exponentials that doc 4
# names: the engines already call StrictMath.cbrt, sin, cos and atan2, and the same ABI argument applies.
style:
  ForbiddenImport:
    active: true
    imports:
      - value: 'java.lang.Math'
        reason: 'Pure engines must use java.lang.StrictMath for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.pow'
        reason: 'Pure engines must use java.lang.StrictMath.pow for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.sqrt'
        reason: 'Pure engines must use java.lang.StrictMath.sqrt for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.cbrt'
        reason: 'Pure engines must use java.lang.StrictMath.cbrt for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.exp'
        reason: 'Pure engines must use java.lang.StrictMath.exp for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.expm1'
        reason: 'Pure engines must use java.lang.StrictMath.expm1 for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.ln'
        reason: 'Pure engines must use java.lang.StrictMath.log for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.ln1p'
        reason: 'Pure engines must use java.lang.StrictMath.log1p for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.log'
        reason: 'Pure engines must use java.lang.StrictMath.log for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.log10'
        reason: 'Pure engines must use java.lang.StrictMath.log10 for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.log2'
        reason: 'Pure engines must use java.lang.StrictMath for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.hypot'
        reason: 'Pure engines must use java.lang.StrictMath.hypot for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.sin'
        reason: 'Pure engines must use java.lang.StrictMath.sin for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.cos'
        reason: 'Pure engines must use java.lang.StrictMath.cos for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.tan'
        reason: 'Pure engines must use java.lang.StrictMath.tan for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.asin'
        reason: 'Pure engines must use java.lang.StrictMath.asin for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.acos'
        reason: 'Pure engines must use java.lang.StrictMath.acos for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.atan'
        reason: 'Pure engines must use java.lang.StrictMath.atan for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.atan2'
        reason: 'Pure engines must use java.lang.StrictMath.atan2 for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.sinh'
        reason: 'Pure engines must use java.lang.StrictMath.sinh for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.cosh'
        reason: 'Pure engines must use java.lang.StrictMath.cosh for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'kotlin.math.tanh'
        reason: 'Pure engines must use java.lang.StrictMath.tanh for bit-identical cross-platform results (Doc 4 Section 4.2).'
      - value: 'org.opencv.imgcodecs.*'
        reason: 'Screening images are never written to disk, and OpenCV image file I/O is not needed (Doc 8 Section 2, ADR-018).'
      - value: 'org.opencv.videoio.*'
        reason: 'The screening path makes no network call and reads no video file; OpenCV video I/O is not needed (Doc 8 Section 6.1, ADR-018).'
      - value: 'org.opencv.dnn.*'
        reason: 'No neural network runs on the device in v1 (ADR-004, ADR-018).'
      - value: 'org.opencv.android.Utils'
        reason: 'Bitmap conversion is not needed: the vision engine takes an ImageFrame (ADR-018).'
